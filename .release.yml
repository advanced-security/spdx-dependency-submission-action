name: "spdx-dependency-submission-action"
repository: "advanced-security/spdx-dependency-submission-action"
version: "0.2.1"

locations:
  - name: "Node Manifest"
    paths:
      - package.json
    patterns:
      - '"version":\s*"([0-9]+\.[0-9]+\.[0-9]+)"'

  - name: "Inline Version"
    paths:
      - index.js
    patterns:
      - 'const VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"'

  - name: "Docs"
    paths:
      - "README.md"
    patterns:
      - 'advanced-security/spdx-dependency-submission-action@v([0-9]+\.[0-9]+\.[0-9]+)'