version: 2
updates:
  # ---------- GitHub Actions ----------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    reviewers:
      - "advanced-security/advanced-security-dependency-graph"
      - "advanced-security/oss-maintainers"
    target-branch: "main"
    commit-message:
      prefix: deps
      prefix-development: chore
    labels:
      - "Dependencies"
    groups:
      actions:
        patterns: ["*"]

  # ---------- JS / TS / NPM ----------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Aligned with .npmrc's min-release-age=7 so Dependabot doesn't propose
      # versions that npm install/ci will then refuse until they're 7 days old.
      default-days: 7
    reviewers:
      - "advanced-security/advanced-security-dependency-graph"
      - "advanced-security/oss-maintainers"
    target-branch: "main"
    commit-message:
      prefix: deps
      prefix-development: chore
    labels:
      - "Dependencies"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
